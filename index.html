<!DOCTYPE html>

    <!--
      Relative on purpose. `svg/` is not `public/`, so an absolute `/svg/...`
      href resolved in dev and 404'd in every production build - Vite only
      copies `public/` verbatim. A relative href is treated as a build input
      and emitted as a hashed asset, which keeps one copy of the file on disk.
    -->

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&family=Kalam:wght@400;700&family=Lilita+One&family=Nunito:wght@400;600;700&display=swap" rel="stylesheet">
    <!--
      Resolve the theme before first paint.

      Doing this in React means the document renders once with the default
      theme and then swaps, which is a full-page white flash for every dark
      mode user on every navigation. This must stay inline and synchronous -
      a deferred or external script is already too late.

      Kept in sync with useTheme in src/hooks.ts: same storage key, same values.
    -->
    <script>
      (function () {
        try {
          var stored = localStorage.getItem('excalidraw-svg:theme');
          var preference = stored === 'light' || stored === 'dark' ? stored : 'system';
          var resolved =
            preference === 'system'
              ? window.matchMedia('(prefers-color-scheme: light)').matches
                ? 'light'
                : 'dark'
              : preference;
          document.documentElement.dataset.theme = resolved;
        } catch (e) {
          document.documentElement.dataset.theme = 'dark';
        }
      })();
    </script>
