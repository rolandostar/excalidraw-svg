<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!--
      Relative on purpose. `svg/` is not `public/`, so an absolute `/svg/...`
      href resolved in dev and 404'd in every production build - Vite only
      copies `public/` verbatim. A relative href is treated as a build input
      and emitted as a hashed asset, which keeps one copy of the file on disk.
    -->
    <link rel="icon" type="image/svg+xml" href="./svg/legacy-gcp/Google-Cloud-Marketplace.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SVG to Excalidraw — convert any SVG to editable Excalidraw shapes</title>
    <meta name="description" content="Convert any SVG into real, editable Excalidraw shapes — not an embedded image. Runs entirely in your browser. Includes 261 Google Cloud icons and a published pixel-diff test suite." />
    <!-- Placeholder. Must match the domain in public/CNAME before the first deploy. -->
    <link rel="canonical" href="https://REPLACE-ME.example.com/" />
    <meta name="theme-color" content="#0f172a" media="(prefers-color-scheme: dark)" />
    <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)" />

    <meta property="og:type" content="website" />
    <meta property="og:title" content="SVG to Excalidraw" />
    <meta property="og:description" content="Real editable vector shapes, not an embedded image. Runs in your browser, with 261 Google Cloud icons ready to drop onto a canvas." />
    <!--
      og:image and twitter:card removed: they pointed at /og.png, which is not
      in public/. A summary_large_image card with a missing image renders as a
      broken preview, which is worse than no card at all. Re-add both once an
      og.png exists.
    -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&family=Kalam:wght@400;700&family=Lilita+One&family=Nunito:wght@400;600;700&display=swap" rel="stylesheet">
    <!--
      Resolve the theme before first paint.

      Doing this in React means the document renders once with the default
      theme and then swaps, which is a full-page white flash for every dark
      mode user on every navigation. This must stay inline and synchronous -
      a deferred or external script is already too late.

      Kept in sync with src/hooks/useTheme.ts: same storage key, same values.
    -->
    <script>
      (function () {
        try {
          var stored = localStorage.getItem('excalidraw-svg:theme');
          var preference = stored === 'light' || stored === 'dark' ? stored : 'system';
          var resolved =
            preference === 'system'
              ? window.matchMedia('(prefers-color-scheme: light)').matches
                ? 'light'
                : 'dark'
              : preference;
          document.documentElement.dataset.theme = resolved;
        } catch (e) {
          document.documentElement.dataset.theme = 'dark';
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
