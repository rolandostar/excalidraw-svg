<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <!--
    The site mark: a wired diagram node drawn with the corner overshoot
    Rough.js produces. Kept in step with `.site-brand-mark` in SiteHeader.tsx.

    Strokes are heavier than the header copy (2.6 vs 2) because a favicon is
    rasterised at 16px and a 2px stroke on a 24-unit viewBox disappears there.
  -->
