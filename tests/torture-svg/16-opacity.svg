<!-- fill-opacity, stroke-opacity and inherited GROUP opacity, which multiplies
     rather than being inherited. Overlaps must composite, not replace. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="24" height="24">
  <rect x="2" y="2" width="12" height="12" fill="#4285f4" fill-opacity="0.4"/>
  <rect x="8" y="8" width="12" height="12" fill="#ea4335" fill-opacity="0.75"/>
  <g opacity="0.5">
    <circle cx="12" cy="19" r="4" fill="#34a853"/>
    <rect x="2" y="17" width="6" height="5" fill="#fbbc04" stroke="#000" stroke-width="1" stroke-opacity="0.3"/>
  </g>
</svg>
