<!-- Everything the converter cannot represent. Nothing here should crash, and
     each item must be REPORTED rather than silently dropped. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="24" height="24">
  <defs>
    <pattern id="p" width="4" height="4" patternUnits="userSpaceOnUse">
      <rect width="2" height="2" fill="#ea4335"/>
    </pattern>
    <filter id="blur"><feGaussianBlur stdDeviation="1"/></filter>
    <marker id="arrow" markerWidth="4" markerHeight="4" refX="2" refY="2" orient="auto">
      <path d="M0 0 L4 2 L0 4 Z" fill="#000"/>
    </marker>
  </defs>
  <rect x="1" y="1" width="10" height="6" fill="url(#p)"/>
  <circle cx="18" cy="5" r="4" fill="#4285f4" filter="url(#blur)"/>
  <text x="2" y="14" font-size="4" fill="#000">Text</text>
  <line x1="2" y1="18" x2="14" y2="18" stroke="#34a853" stroke-width="1.5" marker-end="url(#arrow)"/>
  <path d="M2 22 H22" stroke="#673ab7" stroke-width="1.5" stroke-dasharray="2 2" fill="none"/>
  <g transform="skewX(20)"><rect x="16" y="16" width="4" height="4" fill="#fbbc04"/></g>
</svg>
