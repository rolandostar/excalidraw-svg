<?xml version="1.0" encoding="utf-8"?>
<!-- Reported case. Paint declared on the root svg element, geometry in a bare
     child path with no fill of its own - the shape of most of SVG Repo, and of
     every Feather / Lucide / Tabler / Bootstrap / Heroicons outline icon.

     The inheritance walk in `getShapeStyle` used to stop *before* the root
     element, so `fill` here was never read, the path resolved to "no fill and
     no stroke", and the whole file converted to zero elements.

     NOTE: no literal svg start tag in this comment - the harness finds the root
     tag with a regex and would match the comment text instead. -->
