<!-- Linear and radial gradients, plus a gradient referenced from a style
     attribute. All must flatten to a solid colour rather than vanish. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="24" height="24">
  <defs>
    <linearGradient id="lg" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#4285f4"/>
      <stop offset="1" stop-color="#34a853"/>
    </linearGradient>
    <radialGradient id="rg">
      <stop offset="0" style="stop-color:#fbbc04"/>
      <stop offset="1" style="stop-color:#ea4335"/>
    </radialGradient>
  </defs>
  <rect x="1" y="1" width="22" height="9" fill="url(#lg)"/>
  <circle cx="7" cy="17" r="6" fill="url(#rg)"/>
  <rect x="15" y="12" width="8" height="10" style="fill:url(#lg)"/>
</svg>
