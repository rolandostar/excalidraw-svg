<!-- clipPathUnits="objectBoundingBox": clip coords are FRACTIONS of the
     referencing element's geometry box, not user units. Read as user units the
     clip is a sub-pixel sliver near the origin and the shape disappears.
     The box here is deliberately offset and non-square so a wrong origin or a
     wrong aspect shows up immediately. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="24" height="24">
  <defs>
    <clipPath id="obb" clipPathUnits="objectBoundingBox">
      <rect x="0" y="0" width="0.5" height="1"/>
      <circle cx="0.75" cy="0.5" r="0.25"/>
    </clipPath>
  </defs>
  <rect x="4" y="7" width="16" height="10" fill="#4285f4" clip-path="url(#obb)"/>
</svg>
